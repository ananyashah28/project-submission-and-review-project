# AWS CodeBuild Buildspec for Project Submission & Review Portal
# Builds Docker image and deploys to EC2 via SSM

version: 0.2

phases:
  pre_build:
    commands:
      - echo "Starting build at $(date)"
      - echo "AWS Region = $AWS_REGION"
      - echo "EC2 Instance = $EC2_INSTANCE_ID"

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t project-portal:latest .
      - echo "Docker build completed!"

  post_build:
    commands:
      - echo "Deploying to EC2 via SSM..."
      - |
        aws ssm send-command \
          --instance-ids "$EC2_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "cd /home/ubuntu",
            "sudo yum update -y || sudo apt-get update -y",
            "sudo yum install -y docker git || sudo apt-get install -y docker.io git",
            "sudo systemctl start docker || sudo service docker start",
            "sudo usermod -aG docker ubuntu || true",
            "rm -rf app",
            "git clone -b dev https://github.com/ananyashah28/project-submission-and-review-project.git app",
            "cd app",
            "sudo docker build -t project-portal:latest .",
            "sudo docker stop project-portal || true",
            "sudo docker rm project-portal || true",
            "sudo docker run -d --name project-portal -p 80:3000 -p 8000:8000 project-portal:latest",
            "echo Deployment completed at $(date)"
          ]' \
          --region "$AWS_REGION" \
          --output text
      - echo "SSM command sent successfully!"

artifacts:
  files:
    - '**/*'
