# AWS CodeBuild Buildspec for Project Submission & Review Portal
# Builds Docker image and deploys to EC2 via SSM
# Environment variables are fetched from AWS Secrets Manager

version: 0.2

env:
  secrets-manager:
    NEXT_PUBLIC_API_URL: dev/project-submission-and-review-portal:NEXT_PUBLIC_API_URL
    ALLOWED_ORIGINS: dev/project-submission-and-review-portal:ALLOWED_ORIGINS
    SECRET_KEY: dev/project-submission-and-review-portal:SECRET_KEY
    ALGORITHM: dev/project-submission-and-review-portal:ALGORITHM
    ACCESS_TOKEN_EXPIRE_MINUTES: dev/project-submission-and-review-portal:ACCESS_TOKEN_EXPIRE_MINUTES

phases:
  pre_build:
    commands:
      - echo "Starting build at $(date)"
      - echo "AWS Region = $AWS_REGION"
      - echo "EC2 Instance = $EC2_INSTANCE_ID"
      - echo "Fetching secrets from Secrets Manager..."

  build:
    commands:
      - echo "Skipping Docker build in CodeBuild - will build on EC2"
      - echo "NEXT_PUBLIC_API_URL is set from Secrets Manager"

  post_build:
    commands:
      - echo "Deploying to EC2 via SSM..."
      - |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$EC2_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 600 \
          --parameters commands='["cd /home/ssm-user","sudo yum install -y docker git","sudo systemctl start docker","sudo systemctl enable docker","if [ -d app ]; then cd app && git pull origin dev; else git clone -b dev https://github.com/ananyashah28/project-submission-and-review-project.git app && cd app; fi","sudo docker build --no-cache --build-arg NEXT_PUBLIC_API_URL='"${NEXT_PUBLIC_API_URL}"' -t project-portal:latest .","sudo docker stop project-portal || true","sudo docker rm project-portal || true","sudo docker run -d --name project-portal --restart unless-stopped -p 80:3000 -p 8000:8000 project-portal:latest","sudo docker ps","echo Deployment completed"]' \
          --region "$AWS_REGION" \
          --query "Command.CommandId" \
          --output text)
        echo "SSM Command ID: $COMMAND_ID"
        echo "Waiting for deployment to complete..."
        aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION"
        echo "Deployment finished! Checking status..."
        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text
      - echo "SSM command completed!"

artifacts:
  files:
    - '**/*'
