# AWS CodeBuild Buildspec for Project Submission & Review Portal
# Builds Docker image and deploys to EC2 via SSM
# Environment variables are fetched from AWS Secrets Manager

version: 0.2

env:
  secrets-manager:
    NEXT_PUBLIC_API_URL: project-portal/production:NEXT_PUBLIC_API_URL
    ALLOWED_ORIGINS: project-portal/production:ALLOWED_ORIGINS
    SECRET_KEY: project-portal/production:SECRET_KEY
    ALGORITHM: project-portal/production:ALGORITHM
    ACCESS_TOKEN_EXPIRE_MINUTES: project-portal/production:ACCESS_TOKEN_EXPIRE_MINUTES

phases:
  pre_build:
    commands:
      - echo "Starting build at $(date)"
      - echo "AWS Region = $AWS_REGION"
      - echo "EC2 Instance = $EC2_INSTANCE_ID"
      - echo "Fetching secrets from Secrets Manager..."

  build:
    commands:
      - echo "Creating .env.production file..."
      - |
        cat > .env.production << EOF
        NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
        SECRET_KEY=${SECRET_KEY}
        ALGORITHM=${ALGORITHM}
        ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
        EOF
      - echo "Building Docker image..."
      - docker build -t project-portal:latest .
      - echo "Docker build completed!"

  post_build:
    commands:
      - echo "Deploying to EC2 via SSM..."
      - |
        # Fetch secrets for EC2 deployment
        SECRETS=$(aws secretsmanager get-secret-value --secret-id project-portal/production --query SecretString --output text --region $AWS_REGION)
        
        aws ssm send-command \
          --instance-ids "$EC2_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            \"cd /home/ssm-user\",
            \"sudo yum install -y docker git jq\",
            \"sudo systemctl start docker\",
            \"sudo systemctl enable docker\",
            \"if [ -d app ]; then cd app && git pull origin dev; else git clone -b dev https://github.com/ananyashah28/project-submission-and-review-project.git app && cd app; fi\",
            \"aws secretsmanager get-secret-value --secret-id project-portal/production --query SecretString --output text --region ap-south-1 > /tmp/secrets.json\",
            \"echo NEXT_PUBLIC_API_URL=\\$(cat /tmp/secrets.json | jq -r .NEXT_PUBLIC_API_URL) > .env.production\",
            \"echo ALLOWED_ORIGINS=\\$(cat /tmp/secrets.json | jq -r .ALLOWED_ORIGINS) >> .env.production\",
            \"echo SECRET_KEY=\\$(cat /tmp/secrets.json | jq -r .SECRET_KEY) >> .env.production\",
            \"echo ALGORITHM=\\$(cat /tmp/secrets.json | jq -r .ALGORITHM) >> .env.production\",
            \"echo ACCESS_TOKEN_EXPIRE_MINUTES=\\$(cat /tmp/secrets.json | jq -r .ACCESS_TOKEN_EXPIRE_MINUTES) >> .env.production\",
            \"rm /tmp/secrets.json\",
            \"sudo docker build -t project-portal:latest .\",
            \"sudo docker stop project-portal || true\",
            \"sudo docker rm project-portal || true\",
            \"sudo docker run -d --name project-portal --restart unless-stopped -p 80:3000 -p 8000:8000 project-portal:latest\",
            \"sudo docker ps\",
            \"echo Deployment completed at \\$(date)\"
          ]" \
          --region "$AWS_REGION" \
          --output text
      - echo "SSM command sent successfully!"

artifacts:
  files:
    - '**/*'
