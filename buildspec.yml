# AWS CodeBuild Buildspec for Project Submission & Review Portal
# Builds Docker image in CodeBuild, pushes to ECR, deploys to EC2 via SSM

version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "project-submission-and-review-portal"
  secrets-manager:
    NEXT_PUBLIC_API_URL: dev/project-submission-and-review-portal:NEXT_PUBLIC_API_URL

phases:
  pre_build:
    commands:
      - echo "Starting build at $(date)"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "AWS Account ID = $AWS_ACCOUNT_ID"
      - echo "Logging into Amazon ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "Image URI = $IMAGE_URI"
      - echo "Image Tag = $IMAGE_TAG"
      - echo "NEXT_PUBLIC_API_URL = $NEXT_PUBLIC_API_URL"

  build:
    commands:
      - echo "Building Docker image..."
      - docker build --no-cache --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $IMAGE_REPO_NAME:$IMAGE_TAG .
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $IMAGE_URI:$IMAGE_TAG
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $IMAGE_URI:latest
      - echo "Docker build completed!"

  post_build:
    commands:
      - echo "Pushing Docker image to ECR..."
      - docker push $IMAGE_URI:$IMAGE_TAG
      - docker push $IMAGE_URI:latest
      - echo "Image pushed successfully!"
      - echo "Deploying to EC2 via SSM..."
      - |
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$EC2_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --timeout-seconds 300 \
          --parameters commands='["sudo systemctl start docker","aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 416684166855.dkr.ecr.ap-south-1.amazonaws.com","sudo docker pull 416684166855.dkr.ecr.ap-south-1.amazonaws.com/project-submission-and-review-portal:latest","sudo docker stop project-portal || true","sudo docker rm project-portal || true","sudo docker network create app-network || true","sudo docker network connect app-network postgres-db || true","sudo docker run -d --name project-portal --network app-network -e DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/project_portal -e AWS_S3_BUCKET=project-submission-and-review-portal-416684166855-ap-south-1-an -e AWS_REGION=ap-south-1 --restart unless-stopped -p 80:3000 -p 8000:8000 416684166855.dkr.ecr.ap-south-1.amazonaws.com/project-submission-and-review-portal:latest","sudo docker ps"]' \
          --region "$AWS_REGION" \
          --query "Command.CommandId" \
          --output text)
        echo "SSM Command ID: $COMMAND_ID"
        echo "Waiting for deployment..."
        sleep 60
        STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text)
        echo "Deployment Status: $STATUS"
      - echo "Deployment completed!"

artifacts:
  files:
    - '**/*'
